name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # 배포할 패키지(.js로 바꾼 사본)를 npm으로 깔아서 돌려 본다. node_modules 안에서는 .ts가 실행되지 않는다
      - name: 패키지 확인
        if: runner.os != 'Windows'
        run: pnpm check:package

      # Windows의 Claude Code는 훅 명령을 Git Bash로 실행하고, ${CLAUDE_PLUGIN_ROOT}는 C:/... 모양으로 넘긴다. 같은 방식으로 불러 본다
      - name: 훅 (Git Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          root=$(cygpath -m "$GITHUB_WORKSPACE")
          export MUWI_DIR="$RUNNER_TEMP/muwi-records"
          start='{"session_id":"ci-windows","hook_event_name":"SessionStart","source":"startup","cwd":"'"$root"'"}'
          core="$root/packages/muwi"
          out=$(printf '%s' "$start" | sh "$core/hooks/hook.sh")
          echo "$out"
          case "$out" in *hookSpecificOutput*muwi*) ;; *) echo "SessionStart 훅이 지침을 돌려주지 않았어요"; exit 1 ;; esac
          # Git Bash의 muwi 명령
          sh "$core/bin/muwi" --version
          # 플러그인 없이 설치(setup --claude)하면 settings.json에 넣는 훅 명령도, 적힌 그대로 Git Bash로 실행해 본다
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          node "$core/src/cli.ts" setup --claude
          cmd=$(node -e 'const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(s.hooks.SessionStart[0].hooks[0].command)' "$CLAUDE_CONFIG_DIR/settings.json")
          echo "$cmd"
          out=$(printf '%s' "$start" | bash -c "$cmd")
          case "$out" in *hookSpecificOutput*muwi*) ;; *) echo "setup --claude의 훅 명령이 지침을 돌려주지 않았어요"; exit 1 ;; esac
          node "$core/src/cli.ts" setup --remove

      - name: muwi.cmd (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = & .\packages\muwi\bin\muwi.cmd --version
          if ($LASTEXITCODE -ne 0 -or "$v" -notmatch '^\d+\.\d+\.\d+') { throw "bin\muwi.cmd --version: $v" }
          node packages/muwi/src/cli.ts setup
          if ($LASTEXITCODE -ne 0) { throw "muwi setup failed" }
          $v = & "$env:USERPROFILE\.local\bin\muwi.cmd" --version
          if ($LASTEXITCODE -ne 0 -or "$v" -notmatch '^\d+\.\d+\.\d+') { throw "~\.local\bin\muwi.cmd --version: $v" }
          node packages/muwi/src/cli.ts setup --remove
          if (Test-Path "$env:USERPROFILE\.local\bin\muwi.cmd") { throw "setup --remove left muwi.cmd" }

      - name: muwi.cmd (cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: packages\muwi\bin\muwi.cmd --version
