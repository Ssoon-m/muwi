name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

      # Windows의 Claude Code는 훅 명령을 Git Bash로 실행하고, ${CLAUDE_PLUGIN_ROOT}는 C:/... 모양으로 넘긴다. 같은 방식으로 불러 본다
      - name: 훅 (Git Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          root=$(cygpath -m "$GITHUB_WORKSPACE")
          export MUWI_DIR="$RUNNER_TEMP/muwi-records"
          start='{"session_id":"ci-windows","hook_event_name":"SessionStart","source":"startup","cwd":"'"$root"'"}'
          out=$(printf '%s' "$start" | sh "$root/hooks/hook.sh")
          echo "$out"
          case "$out" in *hookSpecificOutput*muwi*) ;; *) echo "SessionStart 훅이 지침을 돌려주지 않았어요"; exit 1 ;; esac
          # 계획 없이 파일을 고치려 하면 알림을 돌려준다 (nudge)
          edit='{"session_id":"ci-windows","hook_event_name":"PreToolUse","tool_name":"Edit","tool_input":{"file_path":"C:\\work\\app.ts"},"cwd":"'"$root"'"}'
          printf '%s' "$edit" | sh "$root/hooks/hook.sh" nudge
          # Git Bash의 muwi 명령
          sh "$root/bin/muwi" --version

      - name: muwi.cmd (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = & .\bin\muwi.cmd --version
          if ($LASTEXITCODE -ne 0 -or "$v" -notmatch '^\d+\.\d+\.\d+') { throw "bin\muwi.cmd --version: $v" }
          node src/cli.ts setup
          if ($LASTEXITCODE -ne 0) { throw "muwi setup failed" }
          $v = & "$env:USERPROFILE\.local\bin\muwi.cmd" --version
          if ($LASTEXITCODE -ne 0 -or "$v" -notmatch '^\d+\.\d+\.\d+') { throw "~\.local\bin\muwi.cmd --version: $v" }
          node src/cli.ts setup --remove
          if (Test-Path "$env:USERPROFILE\.local\bin\muwi.cmd") { throw "setup --remove left muwi.cmd" }

      - name: muwi.cmd (cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: bin\muwi.cmd --version
