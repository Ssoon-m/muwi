name: release
run-name: ${{ format('release {0}', github.ref_name) }}

# v로 시작하는 태그가 올라오면 모든 패키지를 npm에 올리고 GitHub 릴리스를 만든다.
# 태그는 pnpm release <버전>이 버전 커밋과 함께 만든다 (CONTRIBUTING.md의 "버전 올리기").
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # GitHub 릴리스 만들기
  id-token: write # npm Trusted Publishing: 토큰 없이 올리고 provenance를 붙인다

jobs:
  release:
    if: github.repository == 'Ssoon-m/muwi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing은 npm 11.5.1 이상이 필요하다
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile

      - name: 태그가 main의 커밋인지
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "태그는 main에 있는 커밋을 가리켜야 해요"
            exit 1
          fi

      - name: 태그, 패키지 버전, CHANGELOG가 맞는지
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release.mjs verify "$version"
          node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 0.8.0-beta.1 같은 시험판은 latest가 아니라 그 이름(beta)의 태그로 올린다
          case "$version" in
            *-*) pre="${version#*-}"; echo "dist_tag=${pre%%.*}" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: pnpm test
      # 배포할 패키지를 하나씩 npm i -g로 깔아서 npm이 건 muwi로 돌려 본다
      - run: pnpm check:package
      - run: pnpm build

      # 기대는 패키지 먼저: 코어 → @muwi/herdr → @muwi/herdr-app (같은 버전을 npm에서 받는다).
      # 이미 올라간 패키지는 건너뛴다: 한쪽만 올라가고 멈췄을 때 다시 실행하면 나머지만 올린다
      - name: npm에 올리기
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          for dir in core herdr herdr-app; do
            name=$(node -p "require('./packages/$dir/dist/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "이미 npm에 있어서 건너뜁니다: $name@$VERSION"
              continue
            fi
            npm publish "packages/$dir/dist" --provenance --tag "$DIST_TAG"
          done

      - name: GitHub 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME 릴리스가 이미 있어요"
            exit 0
          fi
          pre=()
          [ "$DIST_TAG" = latest ] || pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"
