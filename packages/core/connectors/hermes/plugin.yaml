# muwi integration for Hermes Agent (managed by muwi; do not edit, run muwi setup again)
# MUWI_INTEGRATION_ID=hermes
name: muwi
version: "1.0"
description: Record Hermes sessions, prompts and tool calls in muwi
provides_hooks:
  - on_session_start
  - on_session_open
  - post_compaction
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
